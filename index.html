<style>
/* Layout: barra in alto con statistiche; a sinistra l'ufficio (protagonista) e sotto il monitor; a destra guida iniziale, lavoro in corso con chat e le schede. */
:root {
  --bg: #17151f;
  --bg-2: #1d1a27;
  --panel: #221f2d;
  --panel-2: #2b2739;
  --line: #363149;
  --ink: #efe8dc;
  --muted: #a39bb3;
  --faint: #6f6886;
  --warm: #f4b86a;
  --warm-ink: #241a10;
  --sage: #9fcaa4;
  --rose: #ec9a90;
  --sky: #92b7dd;
  --lilac: #b9a0da;
  --f-display: "Shantell Sans", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --f-ui: "Shantell Sans", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(1200px 500px at 20% -10%, #2a2340 0%, transparent 60%), var(--bg);
  color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px; min-height: 100vh;
}
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 12px; }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
#musicBtn .txt, #rainBtn .txt { display: none; }
.topbar { flex-wrap: nowrap; }
@media (max-width: 1380px) { .topbar { flex-wrap: wrap; } }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--warm); display: grid; place-items: center; }
.logo svg { width: 20px; height: 20px; }
h1 { white-space: nowrap; margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; line-height: 1; }
h1 span { color: var(--warm); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
@media (min-width: 1381px) { .stats { flex-wrap: nowrap; } }
.chip { display: flex; align-items: center; gap: 8px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.chip .val { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.chip.money .val { color: var(--warm); font-size: 1.2rem; font-weight: 800; }
.chip.lvl { flex-direction: column; align-items: stretch; gap: 4px; min-width: 200px; }
.chip.lvl .row { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; }
.chip.lvl .row b { font-weight: 600; }
.chip.lvl .row span { color: var(--muted); white-space: nowrap; }
#repWrap { color: var(--lilac); }
.xp { height: 5px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lilac), var(--sky)); transition: width .4s; }
.tools { display: flex; gap: 6px; align-items: center; }
.seg { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 9px; border-radius: 8px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }

button { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; transition: border-color .15s, background .15s, transform .05s; }
button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--warm) 70%, var(--line)); }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
button:disabled { opacity: .42; cursor: not-allowed; }
button.small { font-size: .82rem; padding: 5px 10px; border-radius: 9px; }
button.primary { background: var(--warm); color: var(--warm-ink); border-color: var(--warm); font-weight: 600; }
button.ghost { background: transparent; }
a.linkbtn { font-size: .82rem; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); text-decoration: none; white-space: nowrap; transition: border-color .15s; }
a.linkbtn:hover { border-color: color-mix(in srgb, var(--warm) 70%, var(--line)); }
a.linkbtn:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
a.linkbtn b { font-weight: 600; color: var(--warm); margin-left: 4px; font-variant-numeric: tabular-nums; }
.iconbtn { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; padding: 6px 10px; }
.iconbtn svg { width: 17px; height: 17px; flex: none; }
a.iconbtn { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
a.iconbtn:hover { color: var(--ink); border-color: var(--warm); }
.madeby { color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.madeby svg { width: 15px; height: 15px; }
.madeby:hover { color: var(--warm); }
.iconbtn.on { background: color-mix(in srgb, var(--warm) 18%, var(--panel-2)); border-color: var(--warm); color: var(--warm); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; height: max(620px, calc(100dvh - 172px)); }
.left { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.right { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.left .office { flex: 0 1 auto; min-height: 280px; aspect-ratio: var(--ar, 12 / 8); }
.left .monitor { flex: 1 1 250px; min-height: 250px; }
.left .monitor > :not(.editor) { flex: none; }
.left .monitor .editor { flex: 1 1 auto; height: auto; min-height: 100px; }
.right .tabcard { flex: 1 1 auto; min-height: 280px; display: flex; flex-direction: column; }
.right .tabcard .tabs { flex: none; }
.right > .card:not(.tabcard) { flex: none; }
.right .tabcard #panel { flex: 1 1 auto; min-height: 0; overflow: auto; margin-right: -8px; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); height: auto; }
  .left .office { aspect-ratio: 5 / 4; flex: none; min-height: 0; }
  .left .monitor { flex: none; min-height: 0; }
  .left .monitor .editor { height: 170px; flex: none; }
  .right .tabcard #panel { overflow: visible; }
}

.office { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #13111a; max-width: 100%; touch-action: manipulation; box-shadow: 0 18px 40px -24px #000; }
.office canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.ov { position: absolute; font-size: .76rem; color: var(--ink); background: color-mix(in srgb, #13111a 78%, transparent); padding: 3px 10px; border-radius: 99px; pointer-events: none; backdrop-filter: blur(3px); }
.ov.place { left: 10px; top: 10px; font-weight: 600; }
.ov.clock { right: 10px; top: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.ov.keys { left: 50%; transform: translateX(-50%); bottom: 10px; color: var(--muted); white-space: nowrap; }
kbd { font-family: var(--f-code); font-size: .86em; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink); }

.monitor { background: #13111a; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tabbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-family: var(--f-code); font-size: .76rem; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: var(--rose); } .dots i:nth-child(2) { background: var(--warm); } .dots i:nth-child(3) { background: var(--sage); }
.ftab { color: var(--ink); background: #13111a; padding: 3px 10px; border-radius: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.boost { margin-left: auto; color: var(--warm); white-space: nowrap; font-family: var(--f-ui); font-weight: 600; }
.editor { position: relative; height: 150px; overflow: hidden; padding: 10px 0; cursor: text; user-select: none; font-family: var(--f-code); font-size: .8rem; line-height: 1.6; outline: none; }
.editor:focus-visible { box-shadow: inset 0 0 0 2px var(--warm); }
.editor .ln { display: flex; white-space: pre; }
.editor .ln .n { width: 3.6em; flex: none; text-align: right; padding-right: 1em; color: #4a4460; font-variant-numeric: tabular-nums; }
.editor .ln .c { overflow: hidden; min-width: 0; color: #dcd4e6; }
.k { color: var(--warm); } .s { color: var(--sage); } .cm { color: var(--faint); font-style: italic; } .nu { color: var(--rose); } .fn { color: var(--sky); }
.caret { display: inline-block; width: .55em; height: 1.1em; vertical-align: -0.2em; background: var(--warm); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.standing { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; font-family: var(--f-ui); background: color-mix(in srgb, #13111a 84%, transparent); }
.standbtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.standing p { margin: 0 0 12px; color: var(--muted); max-width: 36ch; }
.bug { position: absolute; width: 36px; height: 36px; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 50%; animation: wiggle 1.4s ease-in-out infinite; z-index: 3; }
.bug svg { width: 100%; height: 100%; display: block; }
@keyframes wiggle { 0%,100% { transform: rotate(-12deg) translateY(0); } 50% { transform: rotate(12deg) translateY(-3px); } }
.statusbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); font-family: var(--f-code); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seatbar { display: flex; gap: 8px; padding: 8px; background: var(--panel); }
.seatbar .typebtn { flex: 1; padding: 12px; font-weight: 600; font-size: 1rem; }
.seatbar .autobtn { flex: 1; padding: 12px; font-weight: 600; font-size: 1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .seatbar .typebtn, .seatbar .autobtn { font-size: .9rem; padding: 10px 8px; white-space: normal; } }
.seatbar .autobtn[aria-pressed="true"] { background: #2f4a3c; border-color: #9fcaa4; color: #d8f0dc; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-family: var(--f-display); font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.tut ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tut li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; color: var(--muted); font-size: .9rem; }
.tut li .chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); }
.tut li.now { color: var(--ink); }
.tut li.now .chk { border-color: var(--warm); color: var(--warm); }
.tut li.ok { color: var(--faint); text-decoration: line-through; }
.tut li.ok .chk { background: var(--sage); border-color: var(--sage); color: var(--bg); }

.job-top { display: flex; gap: 12px; align-items: center; }
.job-name { font-family: var(--f-display); font-size: 1.12rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.job-client { color: var(--muted); font-size: .86rem; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; color: #17151f; }
.pill { font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, currentColor 14%, transparent); white-space: nowrap; }
.pill.good { color: var(--sage); } .pill.ok { color: var(--sky); } .pill.meh { color: var(--warm); } .pill.bad { color: var(--rose); }
.meters { display: grid; gap: 8px; margin: 14px 0 4px; }
.meter { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: 99px; transition: width .3s, background .4s; }
.pay { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pay b { color: var(--warm); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.chat { display: grid; gap: 6px; margin-top: 12px; padding: 10px; background: var(--bg-2); border-radius: 12px; }
.msg { padding: 7px 11px; border-radius: 14px; font-size: .87rem; max-width: 88%; line-height: 1.4; }
.msg.c { background: var(--panel-2); border-bottom-left-radius: 4px; justify-self: start; }
.msg.me { background: color-mix(in srgb, var(--warm) 26%, var(--panel)); border-bottom-right-radius: 4px; justify-self: end; }
.msg.sys { color: var(--muted); font-size: .78rem; justify-self: center; background: none; padding: 0; text-align: center; }
.choices { display: grid; gap: 6px; margin-top: 8px; }
.choices button { text-align: left; font-size: .87rem; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.choices .odds { color: var(--warm); font-size: .72rem; font-weight: 700; white-space: nowrap; }
.job-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }

.tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--bg-2); padding: 4px; border-radius: 12px; }
.tabs button span.lbl { display: none; }
.tabs button[aria-selected="true"] { flex: 2.4 1 auto; }
.tabs button[aria-selected="true"] span.lbl { display: inline; }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 8px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
.tabs button svg { width: 16px; height: 16px; flex: none; }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--warm); color: var(--warm-ink); font-size: .7rem; font-weight: 800; display: inline-grid; place-items: center; }
.list { display: grid; gap: 8px; }
.row-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--panel-2); border-radius: 13px; border: 1px solid transparent; }
.row-item:hover { border-color: var(--line); }
.row-item .ico { width: 40px; height: 40px; border-radius: 11px; background: var(--bg); display: grid; place-items: center; }
.row-item .ico svg { width: 24px; height: 24px; }
.row-item .t { font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; line-height: 1.3; }
.row-item .t small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; font-size: .8rem; }
.row-item .d { color: var(--muted); font-size: .8rem; line-height: 1.35; display: block; margin-top: 2px; }
.row-item .act { display: grid; gap: 5px; justify-items: end; font-variant-numeric: tabular-nums; }
.row-item .price { color: var(--warm); font-family: var(--f-display); font-weight: 700; white-space: nowrap; }
.row-item.done .price { color: var(--sage); }
.row-item.lock { opacity: .5; }
.tier { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.tier.s { color: var(--sage); } .tier.m { color: var(--sky); } .tier.l { color: var(--lilac); } .tier.p { color: var(--muted); }
.energy { height: 5px; width: 100%; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.energy i { display: block; height: 100%; transition: width .5s; }
.subhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.subhead.mt { margin-top: 16px; }
.clients { display: grid; gap: 4px; }
.cl { display: grid; grid-template-columns: 30px minmax(0, 1fr) 110px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--bg-2); }
.cl.lost, .cl.lock { opacity: .55; }
.cl .nm { display: grid; line-height: 1.2; min-width: 0; }
.cl .nm b { font-size: .84rem; font-weight: 600; } .cl .nm small { color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl .rel { display: grid; gap: 3px; justify-items: end; } .cl .rel small { color: var(--muted); font-size: .7rem; }
.cl .track { width: 100%; height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; } .cl .track i { display: block; height: 100%; }
.avatar.sm { width: 30px; height: 30px; font-size: .85rem; }
.log { font-size: .85rem; color: var(--muted); display: grid; gap: 6px; max-height: 300px; overflow: auto; }
.log div { padding-left: 12px; border-left: 2px solid var(--line); }
.log div b { color: var(--ink); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 12px 30px -10px #000; color: var(--ink); padding: 11px 18px; border-radius: 14px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; max-width: min(520px, calc(100vw - 32px)); text-align: center; z-index: 20; font-weight: 500; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.float { position: fixed; pointer-events: none; color: var(--warm); font-family: var(--f-display); font-weight: 800; animation: up 1.1s ease-out forwards; z-index: 21; }
@keyframes up { to { transform: translateY(-40px); opacity: 0; } }
.foot { color: var(--faint); font-size: .8rem; text-align: center; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.chip.badges { cursor: pointer; gap: 4px; padding: 6px 10px; font: inherit; color: var(--ink); }
.coin { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 14px; line-height: 1; background: radial-gradient(circle at 35% 30%, #ffe2a8, #f4b86a 60%, #c98a3e); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 2px color-mix(in srgb, #f4b86a 35%, transparent); }
.coin.off { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); filter: grayscale(1); opacity: .5; }
.chip.badges .tlab { display: grid; line-height: 1.1; text-align: left; margin: 0 6px 0 2px; }
.chip.badges .tlab b { font-size: .8rem; font-weight: 700; } .chip.badges .tlab small { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.coin.mini { width: 22px; height: 22px; font-size: 12px; margin-left: -6px; }
.chip.badges .more { font-size: .78rem; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.ach .coin { width: 34px; height: 34px; font-size: 18px; flex: none; }
.testpill { white-space: nowrap; font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--warm-ink); background: var(--lilac); border-radius: 99px; padding: 2px 9px; }
.stars { color: var(--warm); margin-left: 4px; }

/* scheda "Tu": stile, trofei, statistiche */

/* ================= bacheca ================= */
function makeOffer() {
  const pool = CLIENTS.filter(c => c.lvl <= S.level && !cstate(c.id).lost && !(S.job && S.job.cid === c.id) && !S.offers.some(o => o.cid === c.id));
  if (!pool.length) return { id: S.uid++, cid: null, ji: 0, tier: "p", lines: Math.round(10 * Math.pow(1.25, S.level - 1)), pay: Math.round(8 * Math.pow(1.3, S.level - 1)) };
  const c = pick(pool);
  const tier = pick(S.level >= 2 ? ["s", "m", "l"] : ["s", "m"]);
  const tm = { s: [0.7, 1], m: [1, 1.06], l: [1.8, 1.15] }[tier];
  const lines = Math.max(6, Math.round(14 * Math.pow(1.3, S.level - 1) * tm[0] * rnd(0.9, 1.15)));
  const rate = 1.6 * (1 + 0.18 * (S.level - 1)) * tm[1] * (1 + 0.03 * Math.min(S.rep, 20));
  return { id: S.uid++, cid: c.id, ji: Math.floor(Math.random() * 3), tier, lines, pay: Math.round(lines * rate) };
}
function fillOffers() { while (S.offers.length < 3) S.offers.push(makeOffer()); }

function acceptOffer(id) {
  if (S.job) { toast(t("finishFirst")); return; }
  const o = S.offers.find(x => x.id === id); if (!o) return;
  S.offers = S.offers.filter(x => x.id !== id);
  const picky = o.cid ? client(o.cid).picky : 0;
  const chance = o.cid ? 0.55 + 0.12 * picky : 0;
  const triggers = [0.3, 0.68].filter(() => Math.random() < chance);
  S.job = { ...o, done: 0, chat: [], pending: null, triggers, used: [] };
  if (o.cid) {
    const c = client(o.cid);
    S.job.chat.push({ f: "c", t: L(c.hi) }, { f: "me", t: t("greet", { n: cname(c) }) });
  } else S.job.chat.push({ f: "sys", t: t("noClientSys") });
  fillOffers();
  addLog(t("accepted", { j: esc(jobTitle(S.job)), c: o.cid ? t("forClient", { c: esc(L(client(o.cid).who)) }) : "" }));
  renderJob(); renderPanel(); renderTut();
}

  const j = S.job; if (!j) return;
  addLog(t("gaveUp", { j: esc(jobTitle(j)) }));
  S.job = null;

}
function changeRel(cid, d, lastWords) {
  const st = cstate(cid);
  if (d < 0 && hasRole("pm")) d = Math.round(d / 2);
  st.rel = Math.max(0, Math.min(100, st.rel + d));
  if (st.rel <= 0 && !st.lost) {
    st.lost = true;
    const c = client(cid);
    S.rep = Math.max(0, S.rep - 3);
    addLog(t("lostLog", { n: esc(cname(c)), w: esc(L(c.who)) }));
    toast(t("lostToast", { n: cname(c), w: lastWords || "" }));
    if (S.job && S.job.cid === cid) S.job = null;
    S.offers = S.offers.filter(o => o.cid !== cid);
    fillOffers();
    renderJob(); renderPanel();
  }
}

function maybeEvent() {

  j.used.push(idx); j.pending = idx;

function answer(i) {
  const j = S.job; if (!j || j.pending == null) return;
  const ev = EVENTS[j.pending], o = ev.opts[i], c = client(j.cid);

  if (!o.silent) j.chat.push({ f: "me", t: L(o.l) });

const P = { x: 0, y: 0, seated: false, target: null, onArrive: null, stuck: 0, walkT: 0, dir: "down", moving: false, cheer: 0 };

function blocked(x, y) {

    const cx = Math.max(o.x, Math.min(x, o.x + o.w)), cy = Math.max(o.y, Math.min(y, o.y + o.h));

}

  if (dy && !blocked(P.x, P.y + dy)) { P.y += dy; moved = true; }
  if (dx || dy) P.dir = faceDir(dx, dy);

}

function typeChars(n, fromHand) {

  let budget = n;
  const sn = snippets();
  while (budget > 0) {
    const src = sn[S.snip % sn.length];
    if (S.pos >= src.length) { S.pos = 0; S.snip++; continue; }
    const ch = src[S.pos++];
    if (S.pos >= src.length) { S.pos = 0; S.snip++; }

    else { S.lines[S.lines.length - 1] += ch; if (ch === " " && S.lines[S.lines.length - 1].trim() === "") budget++; }
  }

}
function completeLine() {
  const text = S.lines[S.lines.length - 1];
  S.lines.push(""); S.lineNo++;
  if (S.lines.length > 40) S.lines.splice(0, S.lines.length - 40);

function splitComment(line) {
  let q = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === "`") { q = c; continue; }
    if (line.startsWith("//", i) || (c === "#" && line[i + 1] === " ") || line.startsWith("-- ", i)) return [line.slice(0, i), line.slice(i)];
  }
  return [line, ""];
}
function highlight(line) {
  const [code, comment] = splitComment(line);
  return code.split(/("[^"]*"?|'[^']*'?|`[^`]*`?)/).map((p, i) => i % 2 ? `<span class="s">${esc(p)}</span>` :
    esc(p).replace(KW, '<span class="k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nu">$1</span>').replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>')
  ).join("") + (comment ? `<span class="cm">${esc(comment)}</span>` : "");
}
function renderEditor() {
  const box = $("editor");

  const shown = S.lines.slice(-rows), first = S.lineNo - shown.length + 1;
  $("code").innerHTML = shown.map((l, i) => `<div class="ln"><span class="n">${first + i}</span><span class="c">${highlight(l)}${i === shown.length - 1 ? '<span class="caret"></span>' : ""}</span></div>`).join("");

  const k = pick(opts), ev = t("ev");

$("panel").addEventListener("click", e => {

  const id = +b.dataset.id;

      c.fillStyle = "rgba(244,184,106,.5)"; for (let x = (-(T0 * 220) % 60); x < w; x += 60) c.fillRect(x, h * 0.86, 22, 2);
      break;
    }
  }
}
function drawRadio() {
  if ($("radio").hidden) return;
  const r = rcv.getBoundingClientRect(), w = r.width, h = r.height, d = Math.min(2, devicePixelRatio || 1);
  if (!w || !h) return;
  if (rcv.width !== Math.round(w * d) || rcv.height !== Math.round(h * d)) { rcv.width = Math.round(w * d); rcv.height = Math.round(h * d); }
  rctx.setTransform(d, 0, 0, d, 0, 0);
  const st = station();
  drawScene(w, h, st.scene);
  if (S.rain && ["city", "forest", "train"].includes(st.scene)) rainLayer(w, h, "rgba(200,215,240,.4)", 0.6, 9);
  // vetro e telaio della finestra
  rctx.fillStyle = "rgba(255,255,255,.04)"; rctx.beginPath(); rctx.moveTo(w * 0.1, 0); rctx.lineTo(w * 0.3, 0); rctx.lineTo(w * 0.05, h); rctx.lineTo(0, h); rctx.lineTo(0, h * 0.3); rctx.fill();
  if (st.scene !== "train") { rctx.fillStyle = "#3a3352"; rctx.fillRect(w / 2 - 3, 0, 6, h); rctx.fillRect(0, h * 0.48, w, 5); }
}

/* ================= modalità test (end game) ================= */
function setEndgame(on) {
  save();
  endgame = on;
  try { localStorage.setItem(MODE_KEY, on ? "end" : "normal"); } catch (e) {}
  S = freshState(); P.seated = false; P.x = 0;
  const had = load();
  if (!had && on) S = endgameState();
  boot();
  if (!had && !on) seedFirst();
  save();
  toast(on ? t("endToast") : t("endBack"));
}
$("endBtn").addEventListener("click", () => setEndgame(!endgame));
fetch("https://api.github.com/repos/priotts/lofi-dev").then(r => r.ok ? r.json() : null).then(d => {
  if (d && typeof d.stargazers_count === "number") { stars = d.stargazers_count; renderStars(); }
}).catch(() => {});
function bugUrl() {
  const info = [
    "---",
    `- Version: ${GAME_VERSION}${endgame ? " (end game)" : ""}`,
    `- Browser: ${navigator.userAgent}`,
    `- Screen: ${innerWidth}×${innerHeight} @${devicePixelRatio || 1}x`,
    `- Language: ${lang}`,
    `- Level ${S.level}, office ${S.office + 1}, ${S.stars || 0}★`,
  ].join("\n");
  return "https://github.com/priotts/lofi-dev/issues/new?labels=bug&title=" + encodeURIComponent(t("bugTitle")) + "&body=" + encodeURIComponent(t("bugBody") + info);
}
["pointerdown", "focus", "mouseenter"].forEach(ev => $("bugLink").addEventListener(ev, () => { $("bugLink").href = bugUrl(); }));
/* ================= input ================= */
const now = () => performance.now() / 1000;
const KEYMAP = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("dialog").hidden) { if (e.key === "Escape") closeDialog(); return; }
  if (!$("radio").hidden) {
    if (e.key === "Escape") closeRadio();
    else if (e.key === " " && !(e.target.closest && e.target.closest("button, input"))) { e.preventDefault(); setMusic(!music.on); }
    return;
  }
  const onButton = e.target.closest && e.target.closest("button");
  if (onButton && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "Tab") return;
  if (P.seated) {
    if (e.key === "Escape") { standUp(); return; }
    if (e.repeat || (e.key.length > 1 && !["Enter", "Backspace", " "].includes(e.key) && !e.key.startsWith("Arrow"))) return;
    e.preventDefault(); typeChars(perKey(), true); return;
  }
  const k = KEYMAP[e.key];
  if (k) { keys.add(k); e.preventDefault(); return; }
  if (!e.repeat && (e.key === "e" || e.key === "E" || e.key === "Enter" || e.key === " ")) { e.preventDefault(); interact(nearest()); }
});
document.addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys.delete(k); });
window.addEventListener("blur", () => keys.clear());

cv.addEventListener("pointerdown", e => {
  ensureCtx(); music.ctx && music.ctx.resume();
  const r = cv.getBoundingClientRect();
  const tx = (e.clientX - r.left - OX) / T, ty = (e.clientY - r.top - OY) / T;
  const m = S.team.find(m => Math.hypot(m.x - tx, m.y - 0.45 - ty) < 0.55);
  if (m) {
    if (Math.hypot(P.x - m.x, P.y - m.y) < 1.5) interact(m);
    else { if (P.seated) standUp(); P.target = { x: m.x + 0.7, y: m.y + 0.5 }; P.onArrive = m; P.stuck = 0; }
    return;
  }
  const o = office.objs.find(o => o.label && tx >= o.x - 0.2 && tx <= o.x + o.w + 0.2 && ty >= o.y - 0.2 && ty <= o.y + o.h + 0.2);
  if (o) { if (o.type === "desk" && P.seated) return; walkTo(o); return; }
  if (P.seated) standUp();
  P.target = { x: tx, y: Math.max(1.3, ty) }; P.onArrive = null; P.stuck = 0;
});
$("editor").addEventListener("pointerdown", e => { if (e.target.closest(".bug, button")) return; if (P.seated) typeChars(perKey(), true); });
$("typeBtn").addEventListener("click", () => typeChars(perKey(), true));
$("standBtn").addEventListener("click", standUp);
$("autoBtn").addEventListener("click", () => { S.auto = !S.auto; toast(t(S.auto ? "autoOn" : "autoOff")); renderAuto(); save(); });
$("goDesk").addEventListener("click", () => { ensureCtx(); music.ctx && music.ctx.resume(); walkTo(deskOf(0)); });
$("goAuto").addEventListener("click", () => { ensureCtx(); music.ctx && music.ctx.resume(); S.auto = true; renderAuto(); save(); walkTo(deskOf(0)); });
$("musicBtn").addEventListener("click", () => setMusic(!music.on));
$("rainBtn").addEventListener("click", () => {
  if (!rainAudio) { rainAudio = true; S.rain = true; ensureCtx(); music.ctx && music.ctx.resume(); }
  else S.rain = !S.rain;
  syncSoundBtns(); updateRainSound(); save();
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));
let resetArmed = false;
$("resetBtn").addEventListener("click", () => {
  const b = $("resetBtn");
  if (!resetArmed) { resetArmed = true; b.textContent = t("resetSure"); setTimeout(() => { resetArmed = false; b.textContent = endgame ? t("endReset") : t("reset"); }, 3000); return; }
  resetArmed = false; b.textContent = endgame ? t("endReset") : t("reset");
  P.seated = false; P.x = 0;
  if (endgame) { S = endgameState(); boot(); } else { S = freshState(); boot(); seedFirst(); }
  save(); toast(t("newGame"));
});

function setLang(l, remember) {
  lang = l;
  if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
  document.documentElement.lang = l;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("keysHint").innerHTML = t("keys");
  $("standTxt").textContent = t("stand"); $("goDesk").textContent = t("goDesk"); $("goAuto").textContent = "▶ " + t("auto");
  $("typeBtn").textContent = t("tap"); $("standBtn").innerHTML = `${t("standUp")} <kbd>Esc</kbd>`;
  $("footTxt").textContent = t("foot");
  renderStars();
  $("bugLink").textContent = t("bug"); $("resetBtn").textContent = endgame ? t("endReset") : t("reset");
  $("endBtn").textContent = endgame ? t("endOff") : t("endOn");
  $("testPill").hidden = !endgame; $("testPill").textContent = t("testMode");
  $("radioBtn").title = t("radioTitle");
  $("editor").setAttribute("aria-label", t("editorLabel")); cv.setAttribute("aria-label", t("officeLabel"));
  $("placeName").textContent = L(OFFICES[S.office].name);
  if (S.pos >= snippets()[S.snip % snippets().length].length) S.pos = 0;
  syncSoundBtns(); renderHud(); renderEditor(); renderTut(); renderJob(); $("tabs").dataset.sig = ""; renderTabs(); renderPanel();
}

/* ================= salvataggio ================= */
function save() {
  S.lastSeen = Date.now();
  try { localStorage.setItem(saveKey(), packSave()); } catch (e) {}
}
function load(data) {
  let src = data;
  if (!src) { try { src = JSON.parse(localStorage.getItem(saveKey()) || "null"); } catch (e) { src = null; } }
  if (src && src.S) {
    S = Object.assign(freshState(), src.S);
    S.stats = Object.assign(freshState().stats, src.S.stats || {});
    if (!Array.isArray(S.stats.heard)) S.stats.heard = [];
    S.look = Object.assign(freshState().look, src.S.look || {});
    S.decor = Object.assign(freshState().decor, src.S.decor || {});
    S.ach = src.S.ach || {};
    if (src.P) Object.assign(P, src.P);
  }
  return !!(src && src.S);
}

/* ================= ciclo ================= */
let last = performance.now(), acc = 0, saveAcc = 0, uiAcc = 0, achAcc = 0;
function frame(tm) {
  const dt = Math.min(0.1, (tm - last) / 1000); last = tm;
  updatePlayer(dt); updateTeam(dt);
  const ac = autoCps();
  acc += (teamCps() + ac) * dt;
  if (ac > 0) lastType = now();
  if (acc >= 1) { const n = Math.floor(acc); acc -= n; typeChars(n, false); }
  S.clock = (S.clock + dt * 2) % 1440;
  S.boost = Math.max(0, S.boost - dt); S.boostCd = Math.max(0, S.boostCd - dt);
  S.boardCd = Math.max(0, S.boardCd - dt); S.cvCd = Math.max(0, S.cvCd - dt);
  S.stats.time += dt;
  if (S.blackout > 0) { S.blackout -= dt; if (S.blackout <= 0) { S.blackout = 0; toast(t("ev").light); dirty = true; } }
  if ($("radio").hidden && $("dialog").hidden && !document.hidden) { S.evT -= dt; if (S.evT <= 0) { S.evT = rnd(120, 240); if (S.jobsDone > 0) chillEvent(); } }
  achAcc += dt; if (achAcc > 1) { achAcc = 0; checkAch(); }
  drawRadio();
  bugTimer -= dt;
  if (bugTimer <= 0) { bugTimer = (owned("duck") ? 14 : 26) + rnd(0, 18); if (S.loc > 8) spawnBug(); }
  if (bugEl) { bugAge += dt; const qa = S.team.find(m => m.role === "qa" && m.state === "work" && m.seated); if (qa && bugAge > 4) squashBug(qa.name); else if (bugAge > 14) { bugEl.remove(); bugEl = null; } }
  if (dirty) { renderEditor(); dirty = false; }
  if (jobDirty) { updateJobBar(); jobDirty = false; }
  uiAcc += dt; if (uiAcc > 0.25) { uiAcc = 0; renderHud(); refreshButtons(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  ctx.clearRect(0, 0, W, H);
  drawOffice(dt);
  requestAnimationFrame(frame);
}
function boot() {
  buildOffice();
  if (!P.x || (!P.seated && blocked(P.x, P.y))) { P.x = office.door.x; P.y = office.door.y - 0.4; P.seated = false; }
  if (P.seated) { const d = deskOf(0); P.x = d.spot.x; P.y = d.spot.y; P.dir = "up"; }
  S.team.forEach(m => { const d = deskOf(m.desk) || deskOf(1); m.x = d.spot.x; m.y = d.spot.y; m.state = "work"; m.seated = true; m.dir = "up"; m.look = null; });
  fillOffers(); fillCandidates();
  resize(); syncSeat(); setLang(lang, false);
}
function seedFirst() {
  S.offers = [{ id: S.uid++, cid: "rosa", ji: 0, tier: "s", lines: 10, pay: 18 }]; fillOffers();
  renderPanel(); renderTut();
  setTimeout(() => toast(t("welcome")), 500);
}
function start(data) {
  const had = load(data);
  if (!had && endgame) S = endgameState();
  boot();
  if (!had && !endgame) seedFirst();
  else if (!data) {
    const away = Math.min(7200, (Date.now() - (S.lastSeen || Date.now())) / 1000);
    const cps = S.team.reduce((a, m) => a + ROLES[m.role].cps * 0.5 * charsMult(), 0);
    if (away > 30 && cps > 0) {
      const before = S.loc; typeChars(Math.floor(cps * away * 0.5), false);
      S.team.forEach(m => m.energy = Math.max(10, m.energy - away / 4));
      const n = S.loc - before;
      if (n > 0) setTimeout(() => toast(t("away", { n: fmt(n) })), 600);
      renderJob(); renderPanel();
    }
  }
  if (!data) openRadio(true);
  requestAnimationFrame(tm => { last = tm; frame(tm); });
}
window.addEventListener("resize", () => office && resize());
if (window.ResizeObserver) new ResizeObserver(() => office && resize()).observe($("officeBox"));
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

window.claude?.hot?.snapshot?.(() => JSON.parse(packSave()));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
})();
</script>
